# Render Blueprint - Watchout Backend (Staging)
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: watchout-backend-staging
    runtime: python
    region: oregon
    plan: starter
    buildCommand: pip install -r requirements.txt
    preDeployCommand: python -m pytest tests/smoke -v && python -c "from app.main import app; print('IMPORT_OK')"  # Fast deploy gate + startup import check
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    # PR2: Enable zero-downtime blue/green deployment for staging
    deploy:
      type: blue_green
    envVars:
      - key: APP_ENV
        value: staging
      - key: APP_SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: GOOGLE_PLACES_API_KEY
        sync: false
      - key: MAPBOX_ACCESS_TOKEN
        sync: false
      - key: WEATHERAPI_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: SERPER_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.9"
    healthCheckPath: /health
